name: Release (PyPI)

permissions:
  contents: read

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: # build wheels without publishing

jobs:
  wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64
          - os: ubuntu-24.04-arm
            target: aarch64
          - os: macos-13 # last x86_64 macOS runner
            target: x86_64
          - os: macos-14
            target: aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # abi3-py39 in Cargo.toml: one wheel per platform covers CPython >= 3.9.
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: ${{ startsWith(matrix.os, 'ubuntu') && '2_28' || 'auto' }}
          # librocksdb-sys runs bindgen, which needs libclang inside the
          # manylinux container.
          before-script-linux: dnf install -y clang

      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.os }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: dist-sdist
          path: dist

  publish:
    # workflow_dispatch only builds; publishing needs a v* tag.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    # PyPI trusted publishing (OIDC): register this repo + workflow as a
    # pending publisher for "wortel" on pypi.org — no token secret needed.
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
