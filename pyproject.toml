[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "wortel"
version = "0.1.0"
description = "Direct RocksDB reader for subtensor archive-node state"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.maturin]
features = ["python"]
module-name = "wortel"
