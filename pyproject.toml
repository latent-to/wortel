[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "wortel"
version = "0.1.0"
description = "Direct RocksDB reader for subtensor archive-node state"
requires-python = ">=3.9"
license = { text = "MIT" }

[project.optional-dependencies]
serve = ["websockets>=13"]

[project.scripts]
wortel-serve = "wortel.serve.__main__:main"

[tool.maturin]
features = ["python"]
module-name = "wortel._wortel"
python-source = "python"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests/python"]
