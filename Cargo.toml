[workspace]
members = ["serve"]

[package]
name = "wortel"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
description = "Direct RocksDB reader for subtensor archive-node state, mirroring the substrate RPC surface"
license = "MIT"
repository = "https://github.com/latent-to/wortel"
readme = "README.md"
keywords = ["subtensor", "bittensor", "substrate", "rocksdb", "blockchain"]
categories = ["database", "cryptography::cryptocurrencies"]
# Keep the crate tarball lean: no CI/Docker files or the 478K social image.
exclude = ["social.png", ".github/", "Dockerfile", ".dockerignore", "pyproject.toml", "python/"]

[lib]
name = "wortel"
crate-type = ["cdylib", "rlib"]

[dependencies]
# crates.io releases of the sp-* versions that subtensor's polkadot-sdk fork
# (RaoFoundation/polkadot-sdk @ a08c7b0f0b64) resolves in its lockfile. We use
# crates.io instead of the fork because crates.io rejects git dependencies;
# wortel only uses standard upstream APIs (trie codec, hashing, generic block
# types). tests/roundtrip.rs and examples/facade_conformance.py verify
# byte-for-byte behavior. When subtensor bumps its revision, match the sp-*
# versions its new lockfile resolves and re-run both.
sp-core = { version = "37.0.0", default-features = false, features = ["std"] }
sp-runtime = { version = "42.0.0", default-features = false, features = ["std"] }
sp-trie = { version = "40.0.0", default-features = false, features = ["std"] }

# Same versions subtensor's lockfile resolves (crates.io)
codec = { package = "parity-scale-codec", version = "3.7" }
hash-db = "0.16"
rocksdb = { version = "0.21", default-features = false, features = ["snappy", "lz4", "zstd", "zlib", "bzip2"] }
thiserror = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

pyo3 = { version = "0.29", features = ["extension-module", "abi3-py39"], optional = true }

# Fixtures are written through kvdb-rocksdb so test databases are laid out
# exactly the way sc-client-db writes them (`fixture` feature, tests only).
kvdb-rocksdb = { version = "0.19", optional = true }

[features]
default = []
python = ["dep:pyo3"]
fixture = ["dep:kvdb-rocksdb"]

[dev-dependencies]
wortel = { path = ".", features = ["fixture"] }
tempfile = "3"

[profile.release]
lto = "thin"
