[package]
name = "wortel-serve"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
description = "JSON-RPC websocket sidecar serving storage and chain reads from a subtensor archive node's RocksDB"
license = "MIT"
repository = "https://github.com/latent-to/wortel"
readme = "../README.md"
keywords = ["subtensor", "bittensor", "substrate", "rocksdb", "json-rpc"]
categories = ["database", "cryptography::cryptocurrencies"]

[[bin]]
name = "wortel-serve"
path = "src/main.rs"

[dependencies]
# version + path so the crate stays publishable (crates.io strips `path`).
wortel = { version = "1.0.0", path = ".." }

# crates.io releases matching subtensor's fork lockfile — see the note in the
# root Cargo.toml.
sp-core = { version = "37.0.0", default-features = false, features = ["std"] }
sp-runtime = { version = "42.0.0", default-features = false, features = ["std"] }
sp-rpc = "35.0.0"
codec = { package = "parity-scale-codec", version = "3.7" }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal"] }
axum = { version = "0.8", features = ["ws", "http1"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
arc-swap = "1"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"

[dev-dependencies]
wortel = { path = "..", features = ["fixture"] }
tempfile = "3"
http = "1"
